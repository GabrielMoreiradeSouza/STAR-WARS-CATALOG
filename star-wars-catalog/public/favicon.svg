<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="8" fill="#1a1a2e"/>
  <g filter="url(#glow)">
    <rect x="28" y="8" width="8" height="32" rx="3" fill="#4ade80"/>
    <rect x="27" y="8" width="10" height="32" rx="4" fill="none" stroke="#4ade80" stroke-width="1" opacity="0.3"/>
  </g>
  <rect x="24" y="40" width="16" height="6" rx="1.5" fill="#555"/>
  <rect x="23" y="46" width="18" height="4" rx="1" fill="#333"/>
  <rect x="22" y="50" width="20" height="6" rx="2" fill="#222"/>
  <rect x="24" y="52" width="8" height="2" rx="1" fill="#c0c0c0"/>
  <rect x="30" y="46" width="4" height="4" rx="0.5" fill="#8b0000"/>
</svg>
